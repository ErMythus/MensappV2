name: Build iOS IPA

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  main:
    runs-on: macos-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v6
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      
      - run: flutter pub get
      
      - name: Update iOS minimum deployment target
        run: |
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.5;/g' ios/Podfile.lock 2>/dev/null || true
          sed -i '' "s/platform :ios, '[^']*'/platform :ios, '15.5'/g" ios/Podfile
      
      #- run: flutter test
      
      - name: Build iOS
        run: flutter build ios --release --no-codesign
      
      - name: Create IPA
        run: |
          mkdir -p ios
          cd build/ios/Release-iphoneos
          mkdir -p Payload
          mv Runner.app Payload/
          zip -r app.ipa Payload
          mv app.ipa ../../../ios/
      
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: app.ipa
          path: ios/app.ipa
          retention-days: 7